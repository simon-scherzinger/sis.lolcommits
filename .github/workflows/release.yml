# Builds lolcommits.app (macOS universal, signed + notarized when the Apple
# secrets are set) and Linux packages for every version tag like 0.3.0, plus
# the signed update archives and latest.json the app's updater reads.
name: release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One draft release with the notes from CHANGELOG.md; both builds upload into it.
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ github.ref_name }}
        run: |
          awk -v v="$V" '$0 ~ "^## "v"( |$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          # links to repo files like (PRIVACY.md) need the full URL on the release page
          sed -i -E "s#\]\(([A-Za-z0-9_./-]+\.md)\)#](https://github.com/$GITHUB_REPOSITORY/blob/$V/\1)#g" notes.md
          printf '\n**Download:** the `.dmg` for macOS (Apple Silicon and Intel), the `.AppImage` or `.deb` for Linux. Open it and follow the setup.\n' >> notes.md
          gh release create "$V" --draft --verify-tag --title "lolcommits $V" --notes-file notes.md
          # the release list lags behind right after creating, so ask for this one, with retries
          for i in 1 2 3 4 5; do
            id=$(gh release view "$V" --json databaseId --jq .databaseId 2>/dev/null) && [ -n "$id" ] && break
            sleep 3
          done
          [ -n "$id" ] || { echo "::error::release $V not found after creating it"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    # also runs without a tag (workflow_dispatch), then it only builds
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --config src-tauri/tauri.updater.conf.json
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04
            args: --config src-tauri/tauri.updater.conf.json
            rust_targets: ''
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # restores the cache ci.yml saves on main; tag caches are useless to later tags
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          shared-key: tauri
          save-if: false

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libclang-dev libv4l-dev

      - name: Apple signing and notarization
        # only when the secrets exist; otherwise the build is unsigned.
        # Secrets come in via env, so no value is pasted into the script.
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          ID: ${{ secrets.APPLE_ID }}
          PW: ${{ secrets.APPLE_PASSWORD }}
        run: |
          {
            echo "APPLE_CERTIFICATE=$CERT"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PW"
            echo "APPLE_SIGNING_IDENTITY=Developer ID Application: entrecode GmbH (MAMAYY5H8H)"
            echo "APPLE_ID=$ID"
            echo "APPLE_PASSWORD=$PW"
            echo "APPLE_TEAM_ID=MAMAYY5H8H"
          } >> "$GITHUB_ENV"

      - name: Install
        working-directory: app
        run: npm ci

      - name: Test
        working-directory: app/src-tauri
        run: |
          mkdir -p resources && cp ../../lolcommits ../../PRIVACY.md resources/
          LOLCOMMITS_TEST_PATTERN=1 cargo test

      - name: Release id present
        # tauri-action silently skips uploads without one
        if: github.ref_type == 'tag' && needs.release.outputs.id == ''
        run: echo "::error::no release id from the release job" && exit 1

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # signs the update archives; the app checks them against the pubkey in tauri.conf.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          releaseId: ${{ needs.release.outputs.id }}
          args: ${{ matrix.args }}

      - name: Notarize the dmg
        # tauri notarizes the app inside, not the disk image around it
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(ls app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          gh release upload "$GITHUB_REF_NAME" "$dmg" --clobber
