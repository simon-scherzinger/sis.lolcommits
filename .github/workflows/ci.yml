# Tests every push and PR. On main it also warms the Rust cache for release.yml:
# tag runs can only restore caches from their own ref or main.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # same shared-key as release.yml, only main saves
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          shared-key: tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libclang-dev libv4l-dev

      - name: Install
        working-directory: app
        run: npm ci

      - name: Test
        working-directory: app/src-tauri
        run: |
          mkdir -p resources && cp ../../lolcommits ../../PRIVACY.md resources/
          LOLCOMMITS_TEST_PATTERN=1 cargo test

      # release build of the same targets as release.yml, so tags find the release deps in the cache
      - name: Release build
        working-directory: app
        run: npx tauri build ${{ matrix.args }} --no-bundle
