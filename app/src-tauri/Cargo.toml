[package]
name = "lolcommits-app"
version = "0.6.1"
description = "A selfie for every git commit"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
imageproc = "0.25"
ab_glyph = "0.2"
nokhwa = { version = "0.10", features = ["input-native"] }
rand = "0.8"
sha2 = "0.10"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSError", "NSString"] }
objc2-user-notifications = { version = "0.3", features = ["block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[profile.release]
strip = true
lto = "thin"
